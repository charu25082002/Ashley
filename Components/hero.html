  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    // ensure GSAP sees ScrollTrigger
    gsap.registerPlugin(ScrollTrigger);

    // query elements inside SVG
    const leftLeaves = document.querySelectorAll('[href="#leftLeave"]');
    const rightLeaves = document.querySelectorAll('[href="#rightLeave"]');
    const smallLeaves = document.querySelectorAll('[href="#smallLeaf"]');
    const text = document.querySelector('.text');
    const letters = document.querySelectorAll('.text path');

    // left leaves animation
    leftLeaves.forEach((leaf, i) => {
      const index = i / (leftLeaves.length - 1 || 1); // avoid division by zero
      gsap.set(leaf, {
        rotate: index * -45 + 10,
        transformOrigin: 'right bottom'
      });
      gsap.to(leaf, {
        scrollTrigger: {
          trigger: "body",
          scrub: 0.2,
          start: `${index * 40}% top`,
          end: `${index * 60 + 40}% bottom`,
        },
        x: 150,
        y: 300,
        rotate: 15 - (Math.sin(index * Math.PI / 2 - (Math.PI / 2)) * 10),
        scale: 1.3
      });
    });

    // right leaves animation
    rightLeaves.forEach((leaf, i) => {
      const index = i / (rightLeaves.length - 1 || 1);
      gsap.set(leaf, {
        rotate: index * 45 - 10,
        transformOrigin: 'left bottom'
      });
      gsap.to(leaf, {
        scrollTrigger: {
          trigger: "body",
          scrub: 0.2,
          start: `${index * 40}% top`,
          end: `${index * 60 + 40}% bottom`,
        },
        x: -150,
        y: 300,
        rotate: -15 + (Math.sin(index * Math.PI / 2 - (Math.PI / 2)) * 10),
        scale: 1.3
      });
    });

    // small leaves – random initial placement and drifting
    smallLeaves.forEach((leaf, i) => {
      gsap.set(leaf, {
        y: Math.random() * 900,
        x: Math.random() * 1000,
        scale: Math.random() * 0.5 + 0.2,
        transformOrigin: '50% 50%'
      });
      gsap.to(leaf, {
        scrollTrigger: {
          trigger: "body",
          scrub: 0.2,
          start: `top top`,
          end: `bottom bottom`
        },
        scale: Math.random() * 0.5 + 0.2,
        x: Math.random() * 1600,
        y: Math.random() * 900,
        rotate: Math.random() * 1000 + 360
      });
    });

    // letters appear with rotation and fade
    letters.forEach((letter, i) => {
      gsap.from(letter, {
        scrollTrigger: {
          trigger: "body",
          scrub: 0.2,
          start: `${(i / (letters.length - 1)) * 50 + 30}% bottom`,
          end: `${(i / (letters.length - 1)) * 50 + 50}% bottom`
        },
        opacity: 0,
        y: '+=100',
        rotate: 180,
        scale: 2,
        transformOrigin: '50% 50%'
      });
    });

    // reveal SVG after one frame to avoid flash of unstyled content
    requestAnimationFrame(() => {
      document.querySelector('svg').style.opacity = 1;
    });
  </script>
